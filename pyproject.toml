[project]
name = "flowtrace"
version = "0.1.0"
description = "DAG-orchestrated, parameterized, lineage-tracked ML pipeline."
authors = [{name = "Bibek Dhakal"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prefect>=2.14.0",
    "pandera>=0.18.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=src/flowtrace --cov-report=term-missing"
testpaths = ["tests"]